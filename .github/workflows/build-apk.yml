name: Build DOUPAD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: doupad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed | sed -n '1,120p'

      - name: Verify source contracts
        run: |
          python3 verification/test_doupad_source.py
          python3 verification/test_realtime_source.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          cp "$APK" 'dist/DOUPAD-3.2.0-connectivity-debug.apk'
          sha256sum 'dist/DOUPAD-3.2.0-connectivity-debug.apk' | tee 'dist/SHA256SUMS.txt'

      - name: Upload DOUPAD APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DOUPAD-3.2.0-connectivity-debug
          path: |
            dist/DOUPAD-3.2.0-connectivity-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
