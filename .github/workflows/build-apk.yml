name: Build DOUPAD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: doupad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply Kotlin regex hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/unipoint/presentation/ui/DoupadShell.kt')
          s = p.read_text(encoding='utf-8')
          old = r'Regex("[\s/:]")'
          new = r'Regex("[\\s/:]")'
          if old not in s:
              raise SystemExit('Expected broken Regex not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -n 'Regex' app/src/main/java/com/unipoint/presentation/ui/DoupadShell.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show toolchain
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed | sed -n '1,160p'

      - name: Verify source contracts
        run: |
          python3 verification/test_doupad_source.py
          python3 verification/test_realtime_source.py
          python3 verification/test_engine4_source.py
          python3 verification/test_samz_link_connectivity.py
          python3 verification/test_samz_link_v03.py
          python3 verification/test_samz_link_v04.py
          python3 verification/test_doupad_pro_v05.py
          python3 verification/test_doupad_pro_v06.py
          python3 verification/test_doupad_pro_v07.py
          python3 verification/test_doupad_pro_v08.py
          python3 verification/test_doupad_pro_v09.py
          python3 verification/test_doupad_pro_v10.py
          python3 verification/test_doupad_pro_v11.py
          python3 verification/test_doupad_pro_v12.py
          python3 verification/test_doupad_pro_v13.py
          python3 verification/test_doupad_pro_v14.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          cp "$APK" 'dist/DouPad-Pro-v0.14.0-mirror-recovery-debug.apk'
          sha256sum 'dist/DouPad-Pro-v0.14.0-mirror-recovery-debug.apk' | tee 'dist/SHA256SUMS.txt'

      - name: Upload DOUPAD APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DouPad-Pro-v0.14.0-mirror-recovery-debug
          path: |
            dist/DouPad-Pro-v0.14.0-mirror-recovery-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14