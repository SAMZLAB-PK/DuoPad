name: Export Complete DuoPad R24 Project Folder

on:
  push:
    branches:
      - feature/r24-reverse-mirror-monochrome-host
    paths:
      - '.github/workflows/export-complete-project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    name: Package Android and Windows full project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full project source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Make the complete project folder ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/DuoPad-Pro-R24-Complete-Project"
          tar --exclude='./.git' --exclude='./.gradle' --exclude='./app/build' --exclude='./build' --exclude='./.idea' -cf - . |
            tar -xf - -C "$RUNNER_TEMP/DuoPad-Pro-R24-Complete-Project"
          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/DuoPad-Pro-R24-Complete-Project.zip" DuoPad-Pro-R24-Complete-Project
          unzip -t "$GITHUB_WORKSPACE/DuoPad-Pro-R24-Complete-Project.zip" | tail -1
          unzip -l "$GITHUB_WORKSPACE/DuoPad-Pro-R24-Complete-Project.zip" | grep -E 'gradlew|settings.gradle.kts|host/python/unipoint_host.py|app/src/main/AndroidManifest.xml|.github/workflows/build-apk.yml'
          sha256sum "$GITHUB_WORKSPACE/DuoPad-Pro-R24-Complete-Project.zip"
      - name: Upload complete source project
        uses: actions/upload-artifact@v4
        with:
          name: DuoPad-Pro-R24-Complete-Source
          path: DuoPad-Pro-R24-Complete-Project.zip
          if-no-files-found: error
          retention-days: 14
